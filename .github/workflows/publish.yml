name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        default: '0.1.0'

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish all publications
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            TAG=${{ github.event.release.tag_name }}
            VERSION=${TAG#v}
          fi
          echo "Publishing version: $VERSION"
          
          # Decode the base64 key into a temporary environment variable
          # that Gradle can read as a property
          export ORG_GRADLE_PROJECT_signingInMemoryKey=$(echo "${{ secrets.GPG_KEY_CONTENTS }}" | base64 -d)
          
          ./gradlew publishAllPublicationsToMavenCentralRepository -PkmpSplashVersion=$VERSION --no-configuration-cache
          
          # Also publish the plugin (which is an included build)
          # We pass the same environment variables and the decoded key
          cd plugin
          ../gradlew publishAllPublicationsToMavenCentralRepository -PkmpSplashVersion=$VERSION --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          # The key is exported above, so it will be available to the second gradlew call as well
